<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">windows-sandbox-toolkit flow</title>
  <desc id="desc">A host folder and a profile go into the generator, which writes a .wsb file. The validator checks that file. If it passes, Windows Sandbox launches a disposable desktop. Closing it discards everything inside, except changes to a writable mapped folder, which persist on the host.</desc>
  <style>
    .box { fill: #f2f5f8; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .accent { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; rx: 10; }
    .warn { fill: #fef3c7; stroke: #92400e; stroke-width: 1.5; rx: 10; }
    .text { font-family: sans-serif; font-size: 15px; fill: #0f172a; }
    .small { font-family: sans-serif; font-size: 13px; fill: #334155; }
    .arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#334155" />
    </marker>
  </defs>
  <rect class="box" x="10" y="40" width="150" height="70" />
  <text class="text" x="85" y="70" text-anchor="middle">Host folder</text>
  <text class="small" x="85" y="92" text-anchor="middle">(optional, read-only)</text>
  <rect class="box" x="10" y="160" width="150" height="70" />
  <text class="text" x="85" y="190" text-anchor="middle">Profile</text>
  <text class="small" x="85" y="212" text-anchor="middle">untrusted / dev-test</text>
  <rect class="accent" x="210" y="90" width="170" height="90" />
  <text class="text" x="295" y="125" text-anchor="middle">New-SandboxConfig</text>
  <text class="small" x="295" y="147" text-anchor="middle">generator</text>
  <rect class="accent" x="430" y="90" width="150" height="90" />
  <text class="text" x="505" y="125" text-anchor="middle">.wsb file</text>
  <text class="small" x="505" y="147" text-anchor="middle">XML configuration</text>
  <rect class="accent" x="630" y="90" width="170" height="90" />
  <text class="text" x="715" y="125" text-anchor="middle">Test-SandboxConfig</text>
  <text class="small" x="715" y="147" text-anchor="middle">validator (pass / fail)</text>
  <rect class="box" x="430" y="230" width="200" height="70" />
  <text class="text" x="530" y="260" text-anchor="middle">Windows Sandbox</text>
  <text class="small" x="530" y="282" text-anchor="middle">disposable desktop</text>
  <rect class="warn" x="660" y="230" width="220" height="70" />
  <text class="text" x="770" y="260" text-anchor="middle">On close: discarded</text>
  <text class="small" x="770" y="282" text-anchor="middle">except writable mappings</text>
  <path class="arrow" d="M 160 75 L 210 110" />
  <path class="arrow" d="M 160 195 L 210 150" />
  <path class="arrow" d="M 380 135 L 430 135" />
  <path class="arrow" d="M 580 135 L 630 135" />
  <path class="arrow" d="M 715 180 L 600 230" />
  <path class="arrow" d="M 630 265 L 660 265" />
  <text class="small" x="295" y="320" text-anchor="middle">If validation fails, fix the profile or folder and regenerate. Do not hand-edit the .wsb and hope.</text>
</svg>
