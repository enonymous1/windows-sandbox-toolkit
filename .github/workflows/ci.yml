name: CI

# Windows-only CI is deliberate: the validator and generator tests
# include Windows-path cases that cannot run on a Linux runner, and
# the scripts' real users are on Windows. The Python schema tests
# are cross-platform and also run locally on any OS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shipped .wsb profiles with PowerShell
        shell: pwsh
        run: |
          Get-ChildItem -Path '.\configs' -Filter '*.wsb' | ForEach-Object {
            .\scripts\Test-SandboxConfig.ps1 -Path $_.FullName
          }

      - name: Generator and validator behaviour tests
        shell: pwsh
        run: pwsh tests/Test-Generator.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shipped .wsb profiles with Python schema tests
        run: python tests/test_configs.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurator parity tests (JS output vs PowerShell generator)
        shell: pwsh
        run: node tests/test_configurator.mjs

      - name: PSScriptAnalyzer (any finding fails)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path '.\scripts'
          if ($findings) {
            $findings | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
